<!DOCTYPE html>
<html lang="ro">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Battleship</title>
        <link rel="stylesheet" href="assets/css/style.css">
    </head>
    <body>
        <h1>Battleship</h1>

        <ul>
            <li><button data-mode="pvp">PvP</button></li>
            <li><button data-mode="easy">PvCO (easy)</button></li>
            <li><button data-mode="hard">PvCO (hard)</button></li>
        </ul>

        <p id="status">Status</p>

        <button id="rotateBtn">Rotește nava</button>

        <div class="boards">
            <div class="board-container">
                <h2>Harta ta</h2>
                <div id="myBoard" class="board"></div>
            </div>
            <div class="board-container">
                <h2>Harta adversarului</h2>
                <div id="enemyBoard" class="board"></div>
            </div>
        </div>

        <button id="restart">Restart</button>

        <script src="assets/javascript/script.js"></script>
    </body>
</html>
